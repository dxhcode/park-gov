<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040a12" />
    <title>园区政府管理平台</title>
    <style>
      :root {
        color: #e7f6ff;
        background: #040a12;
        font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 10%, rgba(40, 140, 200, 0.35), transparent 32%),
          radial-gradient(circle at 88% 90%, rgba(210, 164, 70, 0.18), transparent 28%),
          #040a12;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(90, 190, 220, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(90, 190, 220, 0.08) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(circle at 50% 40%, #000 20%, transparent 75%);
      }
      main {
        position: relative;
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 64px 0 48px;
      }
      .seal {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        color: #f3d48a;
        font-weight: 700;
        font-size: 24px;
        background: radial-gradient(circle at 30% 30%, #16486f, #07131f 72%);
        box-shadow:
          inset 0 0 0 1px rgba(243, 212, 138, 0.95),
          inset 0 0 0 5px rgba(7, 19, 31, 0.9),
          inset 0 0 0 6px rgba(142, 235, 255, 0.75);
      }
      header { display: flex; gap: 14px; align-items: center; }
      .kicker { margin: 0; color: #e2b657; letter-spacing: 0.28em; font-size: 12px; }
      h1 { margin: 4px 0 0; font-size: 36px; letter-spacing: 0.12em; }
      .lead { max-width: 640px; color: rgba(214, 236, 246, 0.78); line-height: 1.7; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
      a.card {
        display: block;
        padding: 22px;
        color: inherit;
        text-decoration: none;
        background: rgba(8, 24, 40, 0.72);
        border: 1px solid rgba(110, 214, 245, 0.28);
        box-shadow: inset 0 0 0 1px rgba(226, 182, 87, 0.12);
        backdrop-filter: blur(8px);
      }
      a.card:hover { border-color: rgba(226, 182, 87, 0.85); }
      a.card span { color: #8eefff; font-size: 12px; letter-spacing: 0.18em; }
      a.card h2 { margin: 8px 0; letter-spacing: 0.08em; }
      a.card p { margin: 0; color: rgba(214, 236, 246, 0.78); line-height: 1.7; }
      footer { margin-top: 28px; color: rgba(190, 226, 240, 0.66); font-size: 13px; letter-spacing: 0.06em; }
      @media (max-width: 800px) {
        h1 { font-size: 28px; letter-spacing: 0.06em; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="seal" aria-hidden="true">园</div>
        <div>
          <p class="kicker">PARK GOVERNANCE</p>
          <h1>园区政府管理平台</h1>
        </div>
      </header>
      <p class="lead">管理端台账和监管态势大屏都是浏览器里的演示。登录密码 Park@2026，大屏上的地图、图表和金额都是虚构样例。</p>
      <div class="grid">
        <a class="card" href="admin/">
          <span>ADMIN</span>
          <h2>管理端工作台</h2>
          <p>工作台、企业监管、空间监管、园区考核、政策管理、投诉举报、数据报送、统计分析、系统设置。</p>
        </a>
        <a class="card" href="screen/">
          <span>SCREEN</span>
          <h2>监管态势大屏</h2>
          <p>监管总览、空间态势、企业风险、考核看板、投诉热力、告警中心。</p>
        </a>
      </div>
      <footer>本地演示 · 滨江云栖 / 临港智造 / 光谷生命</footer>
    </main>
  </body>
</html>
